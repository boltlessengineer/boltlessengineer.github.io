name: Publish to GH Pages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: find latest version of janet
        uses: oprypin/find-latest-tag@v1
        with:
          repository: janet-lang/janet
          releases_only: true
          prefix: 'v'
        id: janet-ver
      - name: download janet
        run: curl -LO https://github.com/janet-lang/janet/releases/download/v1.38.0/janet-v1.38.0-linux-x64.tar.gz
      - name: "set prefix"
        run: echo "PREFIX=$GITHUB_WORKSPACE/.janet" >> $GITHUB_ENV
        shell: bash
      - name: "mkdir"
        run: mkdir -p $PREFIX
      - name: extract janet
        run: tar -xvzf janet-v1.38.0-linux-x64.tar.gz --strip-components=2 -C $PREFIX
      - name: "set paths"
        run: |
          echo "$PREFIX/bin" >> $GITHUB_PATH
          echo "JANET_HEADERPATH=$PREFIX/include" >> $GITHUB_ENV
          echo "JANET_BINPATH=$PREFIX/bin" >> $GITHUB_ENV
          echo "JANET_LIBPATH=$PREFIX/lib" >> $GITHUB_ENV
          echo "JANET_MANPATH=$PREFIX/man" >> $GITHUB_ENV
          echo "JANET_PATH=$PREFIX" >> $GITHUB_ENV

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Clone norgolith
        run: |
          git clone https://github.com/boltlessengineer/norgolith
          cd norgolith
          git checkout norg-dialect

      - name: Install norgolith
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: --path norgolith

      - name: Use it
        run: lith build

      - name: Deploy to GH Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
